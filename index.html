<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <section>
        <!-- Game Information -->

        <div class="infos">
          <div class="info">
            <h3>
              High Score:
              <span id="high-score">0</span>
            </h3>
          </div>

          <div class="info">
            <h3>
              Score:
              <span id="Score">0</span>
            </h3>
          </div>

          <div class="info">
            <h3>
              Time:
              <span id="time">00-00</span>
            </h3>
          </div>
        </div>

        <!-- Game Board -->

        <div class="board"></div>
      </section>

      <!-- Game Modal -->

      <div class="modal">
        <!-- Start Screen -->

        <div class="start-game">
          <h3>Press Enter or Space to Start</h3>

          <button class="btn btn-start">Start Game</button>
        </div>

        <!-- Game Over Screen -->

        <div class="game-over">
          <h3>Game Over!</h3>

          <button class="btn btn-restart">Restart Game</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
